# --- ЭКРАНЫ ---
# Отключаем опрос шины I2C для отсутствующих OLED-экранов
CONFIG_ZMK_DISPLAY=n

# --- ЭНКОДЕРЫ ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- ZMK STUDIO ---
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# --- ЭНЕРГОСБЕРЕЖЕНИЕ И СОН ---
# Переход в режим ожидания (idle) через 30 секунд бездействия
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Включаем глубокий сон (Deep Sleep)
CONFIG_ZMK_SLEEP=y
# Переход в глубокий сон через 15 минут бездействия (900000 мс)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- BLUETOOTH И ЛОГИ ---
# Мощность радиомодуля оставлена по умолчанию (0 dBm = 4.8 мА вместо 13.6 мА на +8 dBm)
# Отключаем логирование по USB для снижения фонового потребления
CONFIG_ZMK_USB_LOGGING=n
